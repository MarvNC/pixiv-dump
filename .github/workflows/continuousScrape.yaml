name: Scrape All

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      scraped: ${{ steps.budget.outputs.enough }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get time of 5.9 hours from now
        id: get_time_details
        run: |
          echo "::set-output name=time_nextrun::$(($(date +%s) + 21240))"

      - name: Get previous run ID
        id: get_run_id
        run: |
          RUN_ID=$(curl --silent --show-error -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/continuousScrape.yaml/runs" \
            | jq -r '.workflow_runs[1].id // empty')
          echo "Previous run ID: $RUN_ID"
          echo "::set-output name=run_id::$RUN_ID"

      - name: Wait for previous run to complete
        id: wait_previous_run
        run: |
          RUN_ID="${{ steps.get_run_id.outputs.run_id }}"
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "No previous run"
            exit 0
          fi
          while : ; do
            STATUS=$(curl --silent --show-error -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              | jq -r '.status // empty')
            echo "Previous run status: $STATUS"
            if [[ "$STATUS" == "completed" || -z "$STATUS" ]]; then
              break
            fi
            echo "Waiting for the previous run to complete..."
            sleep 60
          done

      - name: Download pixiv.db from latest release
        run: |
          mkdir -p db
          LATEST_RELEASE_URL=$(curl --silent --show-error -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=1" | jq -r '.[0].assets[] | select(.name == "pixiv.db") | .browser_download_url')
          if [ -n "$LATEST_RELEASE_URL" ]; then
            echo "Downloading pixiv.db from $LATEST_RELEASE_URL"
            curl --silent --show-error -L "$LATEST_RELEASE_URL" -o db/pixiv.db
            CHECK=$(sqlite3 db/pixiv.db "PRAGMA integrity_check;")
            echo "downloaded integrity_check: $CHECK"
            if [[ "$CHECK" != "ok" ]]; then
              echo "Downloaded database is malformed"
              exit 1
            fi
          else
            echo "pixiv.db not found in the latest release or no releases found."
          fi

      - name: Install Dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Create db/pixiv.db if it doesn't exist
        run: |
          if [ ! -f db/pixiv.db ]; then
            bunx prisma migrate dev
          fi

      - name: Set up DB
        run: bun run migrate

      - name: Get seconds until next run
        id: get_seconds_until_nextrun
        # prettier-ignore
        run: echo "::set-output name=seconds::$((${{ steps.get_time_details.outputs.time_nextrun }} - $(date +%s)))"

      - name: Get ms until next run
        id: get_ms_until_nextrun
        # prettier-ignore
        run: echo "::set-output name=ms::$((${{ steps.get_seconds_until_nextrun.outputs.seconds }} * 1000))"

      - name: Check the slot has time left
        id: budget
        run: |
          MS=${{ steps.get_ms_until_nextrun.outputs.ms }}
          if (( MS >= 300000 )); then
            echo "::set-output name=enough::true"
          else
            echo "$MS ms left in this slot, skipping scrape and upload"
            echo "::set-output name=enough::false"
          fi

      - name: Scrape
        if: steps.budget.outputs.enough == 'true'
        run:
          xvfb-run -a bun src/index.ts --timeout=${{
          steps.get_ms_until_nextrun.outputs.ms }}

      - name: Checkpoint SQLite
        id: checkpoint
        if: always() && steps.budget.outputs.enough == 'true'
        run: |
          if [[ ! -f db/pixiv.db ]]; then
            echo "db/pixiv.db missing"
            exit 1
          fi
          sqlite3 db/pixiv.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          rm -f db/pixiv-export.db
          sqlite3 db/pixiv.db ".backup db/pixiv-export.db"
          CHECK=$(sqlite3 db/pixiv-export.db "PRAGMA integrity_check;")
          echo "integrity_check: $CHECK"
          if [[ "$CHECK" != "ok" ]]; then
            echo "Refusing to upload a malformed database"
            exit 1
          fi
          mv db/pixiv-export.db db/pixiv.db
          rm -f db/pixiv.db-wal db/pixiv.db-shm

      - name: Upload DB
        uses: actions/upload-artifact@v4
        if:
          always() && steps.budget.outputs.enough == 'true' &&
          steps.checkpoint.outcome == 'success'
        with:
          name: db
          path: db/pixiv.db

      - name: Check if total.txt exists
        id: check_file
        run: |
          if [[ -f total.txt ]]; then
            echo "::set-output name=completed::true"
          else
            echo "::set-output name=completed::false"
          fi

      - name: Upload total.txt if it exists
        if: steps.check_file.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: total
          path: total.txt

  release:
    runs-on: ubuntu-latest
    needs: scrape
    if:
      always() && needs.scrape.result != 'skipped' &&
      needs.scrape.outputs.scraped == 'true'
    steps:
      - name: Get Current Date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: Download DB
        uses: actions/download-artifact@v4
        with:
          name: db
          path: db
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Download total.txt
        uses: actions/download-artifact@v4
        with:
          name: total
          path: total
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
        continue-on-error: true

      - name: Read Total Count from total.txt
        id: read_total
        run: |
          if [[ -f total/total.txt ]]; then
            TOTAL=$(cat total/total.txt)
          else
            TOTAL=''
          fi
          echo "Total: $TOTAL"
          echo "::set-output name=total::$TOTAL"

      - name: Set release body
        id: set_body
        run: |
          if [[ "${{ steps.read_total.outputs.total }}" != "" ]]; then
            echo "::set-output name=body::Total entries in DB: ${{ steps.read_total.outputs.total }}"
          else
            echo "::set-output name=body::Scraping of articles is still in progress."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            db/pixiv.db
          tag_name: ${{ steps.date.outputs.date }}
          # prerelease: ${{ steps.read_total.outputs.total == '' }}
          body: ${{ steps.set_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
