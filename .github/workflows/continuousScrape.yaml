name: Scrape All

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release (default branch only)
        type: boolean
        default: false
      require_complete:
        description: Fail unless all pending articles are processed successfully
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: pixiv-full-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      release_eligible: ${{ steps.report.outputs.release_eligible }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Get time of 5.9 hours from now
        id: get_time_details
        run: echo "time_nextrun=$(($(date +%s) + 21240))" >> "$GITHUB_OUTPUT"

      - name: Download pixiv.db from latest release
        id: previous_db
        run: |
          mkdir -p db
          LATEST_RELEASE_URL=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" \
            | jq -r '[.[] | .assets[] | select(.name == "pixiv.db")][0].browser_download_url // empty')
          if [[ -z "$LATEST_RELEASE_URL" ]]; then
            echo "No recent release contains pixiv.db; refusing to create a partial database."
            exit 1
          fi
          curl --fail --silent --show-error -L "$LATEST_RELEASE_URL" -o db/pixiv.db
          CHECK=$(sqlite3 db/pixiv.db "PRAGMA integrity_check;")
          echo "downloaded integrity_check: $CHECK"
          if [[ "$CHECK" != "ok" ]]; then
            echo "Downloaded database is malformed"
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Set up DB
        run: bun run migrate

      - name: Check the slot has time left
        id: budget
        run: |
          # Leave time for cooperative shutdown, checkpoint, and artifact upload.
          MS=$(((${{ steps.get_time_details.outputs.time_nextrun }} - $(date +%s) - 90) * 1000))
          echo "ms=$MS" >> "$GITHUB_OUTPUT"
          if (( MS >= 300000 )); then
            echo "enough=true" >> "$GITHUB_OUTPUT"
          else
            echo "$MS ms left in this slot, skipping scrape"
            echo "enough=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape
        id: scrape
        if: steps.budget.outputs.enough == 'true'
        run:
          xvfb-run -a bun src/index.ts --timeout=${{ steps.budget.outputs.ms }}

      - name: Checkpoint SQLite
        id: checkpoint
        if: always() && steps.previous_db.outcome == 'success'
        run: |
          test -f db/pixiv.db
          CHECKPOINT=$(sqlite3 db/pixiv.db "PRAGMA wal_checkpoint(TRUNCATE);")
          if [[ "$CHECKPOINT" != 0\|* ]]; then
            echo "SQLite checkpoint is busy: $CHECKPOINT"
            exit 1
          fi
          rm -f db/pixiv-export.db
          sqlite3 db/pixiv.db ".backup db/pixiv-export.db"
          CHECK=$(sqlite3 db/pixiv-export.db "PRAGMA integrity_check;")
          echo "backup integrity_check: $CHECK"
          if [[ "$CHECK" != "ok" ]]; then
            echo "Refusing to upload a malformed database"
            exit 1
          fi
          mv db/pixiv-export.db db/pixiv.db
          rm -f db/pixiv.db-wal db/pixiv.db-shm

      - name: Publish scrape outcome and release decision
        id: report
        if: always()
        env:
          SCRAPE_RESULT: ${{ steps.scrape.outcome }}
          CHECKPOINT_RESULT: ${{ steps.checkpoint.outcome }}
          PREVIOUS_DB_RESULT: ${{ steps.previous_db.outcome }}
          BUDGET_ENOUGH: ${{ steps.budget.outputs.enough }}
        run: python3 .github/scripts/publish-scrape-outcome.py

      - name: Upload DB (including valid partial progress)
        uses: actions/upload-artifact@v4
        if: always() && steps.checkpoint.outcome == 'success'
        with:
          name: db
          path: db/pixiv.db
          if-no-files-found: error

      - name: Upload scrape outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-outcome
          path: scrape-outcome.json
          if-no-files-found: error

      - name: Require a complete full-scrape validation
        if:
          always() && github.event_name == 'workflow_dispatch' &&
          inputs.require_complete
        env:
          COMPLETE: ${{ steps.report.outputs.complete }}
          REPORT_RESULT: ${{ steps.report.outcome }}
        run: |
          if [[ "$REPORT_RESULT" != 'success' || "$COMPLETE" != 'true' ]]; then
            echo 'Full scrape did not complete. Inspect the outcome and retained DB artifacts.'
            exit 1
          fi

  release:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    needs: scrape
    if:
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || (github.event_name ==
      'workflow_dispatch' && inputs.publish_release)) && needs.scrape.result ==
      'success' && needs.scrape.outputs.release_eligible == 'true'
    steps:
      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Download DB
        uses: actions/download-artifact@v4
        with:
          name: db
          path: db

      - name: Download scrape outcome
        uses: actions/download-artifact@v4
        with:
          name: scrape-outcome

      - name: Set release body
        id: body
        run: |
          STATUS=$(jq -r '.status' scrape-outcome.json)
          REASON=$(jq -r '.stopReason' scrape-outcome.json)
          TOTAL=$(jq -r '.database.after' scrape-outcome.json)
          SUCCESSFUL=$(jq -r '.counts.successful' scrape-outcome.json)
          echo "text=Scrape: $STATUS ($REASON). Total entries: $TOTAL. Successfully updated this run: $SUCCESSFUL. See scrape-outcome.json for counts and diagnostics." >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            db/pixiv.db
            scrape-outcome.json
          tag_name: ${{ steps.date.outputs.date }}
          body: ${{ steps.body.outputs.text }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
