name: Upload bootstrap database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate Manhhao bootstrap database
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Manhhao/pixiv-dump/releases/download/2026-09-01/pixiv.db \
            --output pixiv.db
          echo "3ec9d76a8ab370546dadb2105b70a2be69b0794d4e6fcf02c32d1948a15f5e2d  pixiv.db" | sha256sum --check --status
          test "$(stat -c '%s' pixiv.db)" = "1451614208"
          test "$(sqlite3 pixiv.db 'PRAGMA integrity_check;')" = 'ok'
          test "$(sqlite3 pixiv.db 'SELECT count(*) FROM PixivArticle;')" = '724499'

      - name: Upload to upstream bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          gh release upload bootstrap-2026-09-01 pixiv.db --repo
          "$GITHUB_REPOSITORY" --clobber
